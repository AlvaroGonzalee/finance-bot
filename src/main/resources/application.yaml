spring:
  application:
    name: finance-bot

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate # Verify that JPA entities match the database schema without modifying it

  sql:
    init:
      mode: always # Ejecuta schema.sql al arrancar para crear las tablas necesarias.

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}
